name: where_money
description: "Photograph a receipt; get a categorised ledger and a monthly recap."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

# Pub workspace root. One `flutter pub get` here resolves the core package too.
workspace:
  - packages/core

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  where_money_core:
    path: packages/core
  firebase_core: ^4.13.0
  # Not below 6.6.0: firebase_remote_config pulls firebase_core past 4.14.0,
  # where the field 6.5.7 compiles against is gone and Android will not build.
  firebase_auth: ^6.6.0
  google_sign_in: ^7.2.0
  cloud_firestore: ^6.8.0
  flutter_bloc: ^9.1.1
  equatable: ^2.1.0
  image: ^4.9.2
  image_picker: ^1.2.3
  path_provider: ^2.1.6
  path: ^1.9.1
  http: ^1.6.0
  local_auth: ^3.0.2
  shared_preferences: ^2.5.5
  firebase_remote_config: ^6.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  bloc_test: ^10.0.0
  # For the in-memory preference store, so what a Setting persists as can be
  # asserted without a device.
  shared_preferences_platform_interface: ^2.4.1

flutter:
  uses-material-design: true
